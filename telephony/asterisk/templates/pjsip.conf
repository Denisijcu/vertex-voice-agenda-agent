; pjsip.conf — generado por entrypoint.sh a partir de telephony/.env. No editar dentro del contenedor.
[global]
type=global
user_agent=Vertex Voice Agenda

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Asterisk corre dentro de Docker: anuncia la IP de tu PC para que el celular sepa a dónde mandar el audio.
external_media_address=${HOST_IP}
external_signaling_address=${HOST_IP}
; Solo la IP propia del contenedor es "local": así Asterisk anuncia HOST_IP tanto en la señalización como en
; el audio (SDP). Si local_net no contiene su propia IP, el audio sale con la IP interna de Docker y no se oye.
local_net=${CONTAINER_IP}/32

; Tu celular (Linphone) se registra con este usuario.
[${SIP_USER}]
type=endpoint
context=desde-telefono
disallow=all
allow=ulaw,alaw
auth=${SIP_USER}-auth
aors=${SIP_USER}
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[${SIP_USER}-auth]
type=auth
auth_type=userpass
username=${SIP_USER}
password=${SIP_PASSWORD}

[${SIP_USER}]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
