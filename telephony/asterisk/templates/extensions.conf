; extensions.conf — plan de marcado del agente.
[general]
static=yes
writeprotect=yes

[globals]

; Desde Linphone: marca 100 para que conteste el agente.
[desde-telefono]
exten => 100,1,Goto(agente,agente,1)

; El agente: contesta y conecta el audio con la pasarela Python por AudioSocket.
; llamar.ps1 usa esta misma extensión para que el agente te llame a ti.
[agente]
exten => agente,1,Answer()
 same => n,Wait(0.5)
 same => n,Set(LLAMADA_ID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,AudioSocket(${LLAMADA_ID},${GATEWAY_IP_PORT})
 same => n,Hangup()
